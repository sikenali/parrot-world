<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>鹦鹉世界 · CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Nunito', sans-serif; margin: 0; background: #f8f8f0; }
      .loader { display: flex; align-items: center; justify-content: center; height: 100vh; color: #794f27; font-size: 14px; font-weight: 600; }
      .loader span { margin-left: 8px; }
    </style>
  </head>
  <body>
    <div id="sveltia-cms"></div>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      (function() {
        const el = document.getElementById('sveltia-cms');
        SveltiaCMS.init({
          el: el,
          config: {
            backend: {
              name: 'github',
              repo: 'sikenali/parrot-world',
              branch: 'master',
            },
            media_folder: 'public/media',
            public_folder: '/media',
            site_url: 'https://parrotworld.10012049.xyz',
            site_name: '鹦鹉世界 CMS',
            collections: [
              {
                name: 'posts',
                label: '日常点滴',
                label_singular: '文章',
                folder: 'content/posts',
                create: true,
                slug: '{{slug}}',
                fields: [
                  { label: '标题', name: 'title', widget: 'string', required: true },
                  { label: '摘要', name: 'excerpt', widget: 'text', required: false },
                  { label: '封面图', name: 'cover', widget: 'image', required: false },
                  { label: '发布日期', name: 'date', widget: 'datetime', required: true },
                  { label: '分类', name: 'category', widget: 'string', required: true },
                  { label: '标签', name: 'tags', widget: 'list', required: false },
                  { label: '阅读数', name: 'views', widget: 'number', required: false },
                  { label: '评论数', name: 'comments', widget: 'number', required: false },
                  { label: '正文', name: 'body', widget: 'markdown', required: true },
                ],
              },
              {
                name: 'photos',
                label: '照片墙',
                label_singular: '照片',
                folder: 'content/photos',
                create: true,
                slug: '{{slug}}',
                fields: [
                  { label: '图片', name: 'image', widget: 'image', required: true },
                  { label: '标题', name: 'title', widget: 'string', required: false },
                  { label: '描述', name: 'caption', widget: 'string', required: false },
                  { label: '标签', name: 'tags', widget: 'list', required: false },
                  { label: '宽度(占2格)', name: 'wide', widget: 'boolean', required: false },
                  { label: '高度(占2行)', name: 'tall', widget: 'boolean', required: false },
                ],
              },
              {
                name: 'settings',
                label: '站点设置',
                singular_field: true,
                files: [
                  {
                    name: 'author',
                    label: '作者信息',
                    file: 'content/settings/author.yml',
                    fields: [
                      { label: '显示名称', name: 'name', widget: 'string', default: '紫米 ZiMi' },
                      { label: '昵称', name: 'nickname', widget: 'string', default: '紫鹦鹉 · 岛屿居民' },
                      { label: '头像 URL', name: 'avatar', widget: 'image', default: 'https://images.pexels.com/photos/14829188/pexels-photo-14829188.jpeg?auto=compress&cs=tinysrgb&w=150&h=150&dpr=2' },
                      { label: '个人简介', name: 'bio', widget: 'text', default: '我是一只紫色的鹦鹉，最喜欢的事情就是在岛上散步、收集种子、和邻居们聊天。' },
                      { label: '座右铭', name: 'quote', widget: 'string', default: '"假如我再也见不到你，祝你早安，午安，晚安！"' },
                      { label: '居住位置', name: 'location', widget: 'string', default: '住在岛最东边的椰子树下' },
                      { label: '照片总数', name: 'totalPhotos', widget: 'number', default: 128 },
                      { label: '文章总数', name: 'totalPosts', widget: 'number', default: 56 },
                      { label: '访客总数', name: 'totalVisitors', widget: 'number', default: 892 },
                    ],
                  },
                  {
                    name: 'notices',
                    label: '滚动公告',
                    file: 'content/settings/notices.yml',
                    fields: [
                      { label: '公告列表', name: 'items', widget: 'list', fields: [
                        { label: '文字', name: 'text', widget: 'string', required: true },
                      ]},
                    ],
                  },
                ],
              },
            ],
          },
        });
      })();
    </script>
  </body>
</html>
