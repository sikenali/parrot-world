<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹦鹉世界 · 紫米的小窝</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --theme-primary: #19c8b9;
      --theme-primary-hover: #3dd4c6;
      --theme-primary-active: #11a89b;
      --theme-focus: #ffcc00;
      --theme-text: #794f27;
      --theme-text-body: #725d42;
      --theme-text-muted: #8a7b66;
      --theme-surface: #f8f8f0;
      --theme-surface-content: #f7f3df;
      --theme-surface-secondary: #f0e8d8;
      --theme-border: #c4b89e;
      --theme-accent: #f7cd67;
      --content-width: 72rem;
      --prose-width: 46rem;
      --header-height: 3.75rem;
      --header-width: 58rem;
      --header-offset: 1rem;
      --page-gutter: clamp(1.25rem, 3vw, 3.5rem);
      --radius-small: 0.75rem;
      --radius-base: 1.125rem;
      --radius-large: 1.5rem;
      --radius-pill: 999px;
      --motion-duration: 220ms;
      --motion-easing: cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-small: 0 2px 4px rgb(61 52 40 / 6%);
      --shadow-base: 0 3px 10px rgb(61 52 40 / 10%);
      --color-on-primary: #173b35;
      --color-on-accent: #3b2c16;
      --color-surface-raised: rgb(255 255 255 / 52%);
      --color-surface-glass: rgb(248 248 240 / 64%);
      --color-ink-subtle: rgb(114 93 66 / 16%);
      --color-white: #fffdf6;

      --font-family: 'Nunito', 'Noto Sans SC', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-family);
      background: var(--theme-surface);
      color: var(--theme-text);
      font-weight: 500;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== HEADER ===== */
    .site-header {
      position: relative;
      z-index: 50;
      top: 0;
      width: 100%;
      min-height: var(--header-height);
      pointer-events: none;
    }

    .header-surface {
      position: fixed;
      top: 0; right: 0; left: 0;
      width: 100%;
      margin-inline: auto;
      min-height: var(--header-height);
      overflow: hidden;
      border: 1px solid transparent;
      background:
        radial-gradient(ellipse 42rem 29rem at 8% -8rem, rgb(25 200 185 / 19%), transparent 74%),
        radial-gradient(ellipse 34rem 24rem at 92% 9rem, rgb(247 205 103 / 12%), transparent 76%),
        rgb(248 248 240 / 64%);
      backdrop-filter: blur(14px) saturate(1.06);
      pointer-events: auto;
      isolation: isolate;
      transition:
        width 360ms var(--motion-easing),
        transform 360ms var(--motion-easing),
        border-radius 360ms var(--motion-easing),
        background 360ms var(--motion-easing),
        box-shadow 360ms var(--motion-easing),
        border-color 360ms var(--motion-easing);
    }

    .header-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      width: 100%;
      min-height: var(--header-height);
      align-items: center;
      gap: 0;
      padding: 0.5rem clamp(1rem, 5vw, 5rem);
      transition: padding 360ms var(--motion-easing);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--theme-text);
      justify-self: start;
      text-decoration: none;
    }

    .brand-mark {
      display: block;
      width: 2.5rem;
      height: 2.5rem;
      overflow: hidden;
      border-radius: 50%;
      border: 2px solid var(--theme-border);
      background: var(--theme-primary);
      transition: transform 360ms var(--motion-easing);
    }

    .brand-mark-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-copy {
      display: grid;
      gap: 0.05rem;
      line-height: 1;
    }

    .brand-copy strong {
      font-size: 1.12rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      color: var(--theme-text);
    }

    .brand-copy small {
      color: var(--theme-text-muted);
      font-size: 0.54rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .primary-nav { display: flex; align-items: center; justify-self: center; }
    .primary-nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.22rem;
      margin: 0; padding: 0;
      list-style: none;
    }

    .nav-link {
      display: inline-flex;
      min-height: 2.45rem;
      align-items: center;
      border-radius: var(--radius-pill);
      padding: 0.42rem 0.88rem;
      color: var(--theme-text-body);
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
      transition:
        background var(--motion-duration) var(--motion-easing),
        color var(--motion-duration) var(--motion-easing),
        transform var(--motion-duration) var(--motion-easing);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
    }

    .nav-link:hover {
      transform: translateY(-1px);
      background: rgb(25 200 185 / 12%);
      color: var(--theme-text);
    }

    .nav-link.active {
      background: linear-gradient(135deg, #a9b9dc, #92a8d7);
      box-shadow: inset 0 1px rgb(255 255 255 / 34%), 0 0.16rem 0 #778cb9;
      color: #fff;
    }

    .theme-toggle {
      display: inline-flex;
      min-height: 2.45rem;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--theme-text-body);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      justify-self: end;
      transition: background var(--motion-duration) var(--motion-easing), color var(--motion-duration) var(--motion-easing);
    }

    .theme-toggle:hover { background: rgb(25 200 185 / 12%); color: var(--theme-text); }

    .theme-icon { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentcolor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9; }
    .theme-icon-moon, .theme-icon-system { display: none; }
    :root[data-theme-setting='light'] .theme-icon-sun { display: block; }
    :root[data-theme-setting='light'] .theme-icon-moon,
    :root[data-theme-setting='light'] .theme-icon-system { display: none; }
    :root[data-theme-setting='dark'] .theme-icon-sun,
    :root[data-theme-setting='dark'] .theme-icon-system { display: none; }
    :root[data-theme-setting='dark'] .theme-icon-moon { display: block; }
    :root[data-theme-setting='system'] .theme-icon-sun,
    :root[data-theme-setting='system'] .theme-icon-moon { display: none; }
    :root[data-theme-setting='system'] .theme-icon-system { display: block; }

    .menu-toggle { display: none; }

    /* Compact header on scroll */
    .site-header.is-compact .header-surface {
      width: min(calc(100% - (var(--page-gutter) * 2)), var(--header-width));
      border-color: rgb(159 146 125 / 45%);
      border-radius: 1.7rem;
      background:
        linear-gradient(112deg, rgb(255 255 255 / 88%), rgb(247 243 223 / 92%) 48%, rgb(240 232 216 / 90%)),
        var(--theme-surface-content);
      box-shadow:
        0 1.1rem 2.8rem rgb(61 52 40 / 15%),
        inset 0 1px rgb(255 255 255 / 82%);
      transform: translateY(var(--header-offset));
    }

    .site-header.is-compact .header-surface::before {
      position: absolute; inset: 0; z-index: 0;
      background-image: radial-gradient(rgb(121 79 39 / 13%) 1px, transparent 1px);
      background-size: 13px 13px;
      opacity: 0.35;
      content: '';
    }

    .site-header.is-compact .header-inner { position: relative; z-index: 1; padding: 0.38rem 0.6rem 0.38rem 0.48rem; }
    .site-header.is-compact .brand-mark { transform: scale(0.96) rotate(-2deg); }

    @media (max-width: 640px) {
      .header-surface { overflow: visible; }
      .header-inner { display: flex; gap: 0; padding-inline: 0.5rem; }
      .site-header.is-compact .header-surface {
        width: calc(100% - (var(--page-gutter) * 2));
        transform: translateY(0.5rem);
      }
      .primary-nav {
        position: absolute; top: calc(100% + 0.45rem); left: 50%;
        z-index: 2; display: none; width: 100vw;
        transform: translateX(-50%);
        border: 1px solid rgb(159 146 125 / 48%);
        border-radius: var(--radius-large);
        background: var(--theme-surface-content);
        padding: 0.7rem;
        box-shadow: var(--shadow-base);
      }
      .site-header.is-menu-open .primary-nav { display: grid; gap: 0.35rem; }
      .primary-nav nav { min-width: 0; overflow: visible; }
      .primary-nav ul { display: grid; gap: 0.35rem; }
      .primary-nav .nav-link { width: 100%; min-height: 3.1rem; justify-content: flex-start; padding-inline: 1rem; font-size: 0.96rem; }
      .brand { margin-right: auto; }
      .brand-copy small { display: none; }
      .brand-copy strong { overflow: hidden; font-size: 1rem; text-overflow: ellipsis; white-space: nowrap; }
      .brand-mark { width: 2.25rem; height: 2.25rem; }
      .theme-toggle { min-width: 2.25rem; min-height: 2.25rem; margin-left: 0.15rem; }
      .menu-toggle {
        display: grid; width: 2.75rem; min-width: 2.75rem; height: 2.75rem;
        align-content: center; justify-content: center; gap: 0.24rem;
        margin-left: 0.15rem; border: 1px solid transparent;
        border-radius: var(--radius-pill); background: transparent;
        color: var(--theme-text-body); cursor: pointer;
      }
      .menu-toggle span {
        display: block; width: 1.15rem; height: 0.14rem;
        border-radius: var(--radius-pill); background: currentcolor;
        transition: transform var(--motion-duration) var(--motion-easing);
      }
      .site-header.is-menu-open .menu-toggle span:nth-child(1) { transform: translateY(0.4rem) rotate(45deg); }
      .site-header.is-menu-open .menu-toggle span:nth-child(2) { transform: scaleX(0); }
      .site-header.is-menu-open .menu-toggle span:nth-child(3) { transform: translateY(-0.4rem) rotate(-45deg); }
      .theme-toggle-label { display: none; }
    }

    /* ===== NOTICES ===== */
    .notices-bar {
      background: linear-gradient(90deg, var(--theme-primary), var(--theme-primary-hover));
      color: var(--color-on-primary);
      text-align: center;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .notices-bar .notice-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      margin: 0 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .notices-bar .notice-dot.active { background: #fff; }

    /* ===== HERO ===== */
    .hero-section {
      padding-top: calc(var(--header-height) + 32px);
      padding-bottom: 32px;
    }

    .hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 var(--page-gutter);
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 32px;
      align-items: start;
    }

    .hero-left { display: flex; flex-direction: column; gap: 20px; }

    .hero-banner {
      background: var(--theme-surface-content);
      border: 1px solid var(--theme-border);
      border-radius: var(--radius-large);
      padding: 32px 36px;
      position: relative;
      overflow: hidden;
    }

    .hero-banner::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgb(121 79 39 / 8%) 1px, transparent 1px);
      background-size: 12px 12px;
      pointer-events: none;
    }

    .hero-banner-content { position: relative; z-index: 1; }

    .hero-eyebrow {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.16em;
      color: var(--theme-text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 900;
      color: var(--theme-text);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .hero-title em {
      font-style: normal;
      color: var(--theme-primary);
    }

    .hero-subtitle {
      font-size: 15px;
      color: var(--theme-text-body);
      font-weight: 500;
      line-height: 1.6;
      max-width: 480px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid var(--theme-border);
      background: var(--theme-surface);
      color: var(--theme-text-body);
      transition: all var(--motion-duration) var(--motion-easing);
    }

    .hero-tag:hover {
      border-color: var(--theme-primary);
      color: var(--theme-primary);
      background: rgb(25 200 185 / 8%);
    }

    .hero-tag svg { width: 12px; height: 12px; }

    /* Hero right sidebar */
    .hero-sidebar { display: flex; flex-direction: column; gap: 12px; }

    .author-card {
      background: var(--theme-surface-content);
      border: 1px solid var(--theme-border);
      border-radius: var(--radius-large);
      overflow: hidden;
      transition: transform var(--motion-duration) var(--motion-easing);
    }

    .author-card:hover { transform: translateY(-2px); }

    .author-card-header {
      background: var(--theme-primary);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      position: relative;
    }

    .author-card-header::after {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgb(255 255 255 / 8%) 1px, transparent 1px);
      background-size: 8px 8px;
      pointer-events: none;
    }

    .author-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.6);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .author-info { position: relative; z-index: 1; }

    .author-eyebrow {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
    }

    .author-name {
      font-size: 17px;
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
    }

    .author-role {
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }

    .author-card-body { padding: 14px 16px; }

    .author-bio {
      font-size: 12px;
      color: var(--theme-text-muted);
      font-weight: 600;
      line-height: 1.5;
      font-style: italic;
      margin-bottom: 12px;
    }

    .author-detail {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--theme-text-body);
      font-weight: 600;
    }

    .author-detail svg { width: 14px; height: 14px; color: var(--theme-primary); flex-shrink: 0; }

    .author-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .stat-item {
      text-align: center;
      padding: 8px 4px;
      background: var(--theme-surface);
      border-radius: var(--radius-small);
      border: 1px solid var(--theme-border);
    }

    .stat-num {
      font-size: 18px;
      font-weight: 900;
      color: var(--theme-primary);
      line-height: 1;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--theme-text-muted);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .island-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgb(111 186 44 / 8%);
      border: 1px solid rgb(111 186 44 / 25%);
      border-radius: var(--radius-small);
      margin-top: 8px;
    }

    .island-status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--theme-success, #6fba2c);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .island-status-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--theme-text-body);
    }

    /* ===== MAIN LAYOUT ===== */
    .main-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 var(--page-gutter) 64px;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 32px;
      align-items: start;
    }

    .content-primary { display: flex; flex-direction: column; gap: 24px; }
    .content-secondary { display: flex; flex-direction: column; gap: 16px; }

    /* ===== SECTION RIBBON ===== */
    .section-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 0;
      margin-bottom: 16px;
    }

    .section-ribbon-bg {
      background: var(--theme-primary);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 20px 6px 16px;
      border-radius: var(--radius-small) 0 0 var(--radius-small);
      letter-spacing: 0.04em;
      position: relative;
    }

    .section-ribbon-bg::after {
      content: '';
      position: absolute;
      right: -12px; top: 0;
      width: 0; height: 0;
      border-left: 12px solid var(--theme-primary);
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
    }

    .section-ribbon-sub {
      background: var(--theme-primary-bg, #e6f9f6);
      color: var(--theme-primary);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 0 var(--radius-small) var(--radius-small) 0;
      border: 1.5px solid var(--theme-primary);
      border-left: none;
    }

    /* ===== PHOTO WALL ===== */
    .photo-wall-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 160px;
      gap: 10px;
    }

    .photo-card {
      border-radius: var(--radius-base);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 1.5px solid var(--theme-border);
      background: var(--theme-surface-content);
      transition: transform var(--motion-duration) var(--motion-easing), box-shadow var(--motion-duration) var(--motion-easing);
    }

    .photo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgb(61 52 40 / 15%);
    }

    .photo-card.tall { grid-row: span 2; }
    .photo-card.wide { grid-column: span 2; }

    .photo-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--motion-easing);
    }

    .photo-card:hover img { transform: scale(1.06); }

    .photo-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 28px 10px 8px;
      background: linear-gradient(transparent, rgba(121,79,39,0.55));
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      transition: opacity var(--motion-duration) var(--motion-easing);
    }

    .photo-card:hover .photo-caption { opacity: 1; }

    /* ===== BLOG POSTS ===== */
    .posts-list { display: flex; flex-direction: column; gap: 14px; }

    .post-card {
      display: grid;
      grid-template-columns: 200px 1fr;
      background: var(--theme-surface-content);
      border: 1px solid var(--theme-border);
      border-radius: var(--radius-large);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform var(--motion-duration) var(--motion-easing), box-shadow var(--motion-duration) var(--motion-easing);
    }

    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-base);
    }

    .post-cover {
      width: 100%; height: 100%;
      min-height: 140px;
      object-fit: cover;
      display: block;
    }

    .post-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .post-meta-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .post-category {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      background: rgb(25 200 185 / 10%);
      color: var(--theme-primary);
      border: 1px solid rgb(25 200 185 / 25%);
    }

    .post-date {
      font-size: 11px;
      color: var(--theme-text-muted);
      font-weight: 600;
    }

    .post-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--theme-text);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .post-excerpt {
      font-size: 13px;
      color: var(--theme-text-body);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-meta-bottom {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: auto;
    }

    .post-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--theme-text-muted);
      background: var(--theme-surface);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--theme-border);
    }

    .post-stats {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-stat {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--theme-text-muted);
      font-weight: 600;
    }

    /* ===== SIDEBAR WIDGETS ===== */
    .widget {
      background: var(--theme-surface-content);
      border: 1px solid var(--theme-border);
      border-radius: var(--radius-large);
      overflow: hidden;
    }

    .widget-header {
      background: var(--theme-primary);
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      position: relative;
    }

    .widget-header::after {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgb(255 255 255 / 6%) 1px, transparent 1px);
      background-size: 6px 6px;
      pointer-events: none;
    }

    .widget-body { padding: 14px 16px; }

    .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      color: var(--theme-text-body);
      border: 1px solid var(--theme-border);
      background: var(--theme-surface);
      text-decoration: none;
      transition: all var(--motion-duration) var(--motion-easing);
      cursor: pointer;
    }

    .tag-item:hover {
      border-color: var(--theme-primary);
      color: var(--theme-primary);
      background: rgb(25 200 185 / 8%);
    }

    .tag-count {
      font-size: 10px;
      background: var(--theme-border);
      color: var(--theme-text-muted);
      border-radius: 50%;
      width: 16px; height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== ABOUT SECTION ===== */
    .about-section {
      background: var(--theme-surface-content);
      border: 1px solid var(--theme-border);
      border-radius: var(--radius-large);
      overflow: hidden;
      margin-top: 8px;
    }

    .about-hero-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--theme-border);
    }

    .about-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    .about-name-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .about-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--theme-primary);
      box-shadow: 0 2px 8px rgba(25,200,185,0.2);

    .about-name {

      font-weight: 900;
      color: var(--theme-text);

    .about-nick {
      font-size: 12px;
      color: var(--theme-text-muted);
      font-weight: 600;
    }

    .about-bio {

      color: var(--theme-text-body);

      padding: 12px 16px;

      border: 1px solid var(--theme-border);

    .about-detail-card-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);

      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid;
    }

    .about-detail-card-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--theme-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .about-detail-card-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--theme-text);
      margin-top: 2px;
    }

    .about-quote {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--theme-surface-content);
      border: 1px dashed var(--theme-border);
      border-radius: var(--radius-small);
      font-size: 13px;
      font-style: italic;
      color: var(--theme-text-muted);
      font-weight: 600;
    }

    .about-quote svg { color: var(--theme-accent); flex-shrink: 0; }

    /* ===== FOOTER ===== */
    .site-footer {
      background: var(--theme-surface-content);
      border-top: 1px solid var(--theme-border);
      padding: 24px;
      text-align: center;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-left {
      font-size: 12px;
      color: var(--theme-text-muted);
      font-weight: 600;
    }

    .footer-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .footer-brand-icon {
      width: 20px; height: 20px;
      background: var(--theme-primary);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .footer-brand-icon svg { width: 12px; height: 12px; color: #fff; }

    .footer-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .footer-link {
      font-size: 12px;
      color: var(--theme-text-muted);
      text-decoration: none;
      font-weight: 700;
      transition: color var(--motion-duration) var(--motion-easing);
    }

    .footer-link:hover { color: var(--theme-primary); }

    /* ===== DARK MODE ===== */
    :root[data-theme='dark'] {
      --theme-text: #f2e7d5;
      --theme-text-body: #d6c9b7;
      --theme-text-muted: #aca08f;
      --theme-surface: #181d1a;
      --theme-surface-content: #222a24;
      --theme-surface-secondary: #2b342c;
      --theme-border: #4a574b;
      --theme-focus: #ffd878;
      --theme-accent: #e7bd63;
      --shadow-small: 0 2px 6px rgb(0 0 0 / 18%);
      --shadow-base: 0 8px 24px rgb(0 0 0 / 24%);
      --color-ink-subtle: rgb(214 201 183 / 18%);

    @media (max-width: 900px) {
      .hero-inner { grid-template-columns: 1fr; }
      .hero-sidebar { display: none; }
      .main-content { grid-template-columns: 1fr; }
      .content-secondary { display: none; }
      .photo-wall-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 140px;
      }
      .photo-card.wide { grid-column: span 1; }
      .post-card { grid-template-columns: 140px 1fr; }
    }

    @media (max-width: 480px) {
      .hero-title { font-size: 26px; }
      .hero-banner { padding: 24px 20px; }
      .post-card { grid-template-columns: 1fr; }
      .post-cover { min-height: 160px; }
      .photo-wall-grid { grid-auto-rows: 120px; }
      .about-body { padding: 16px; }
      .about-name-row { flex-direction: column; align-items: flex-start; gap: 10px; }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--theme-surface); }
    ::-webkit-scrollbar-thumb { background: var(--theme-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--theme-text-muted); }
  </style>
</head>

    // ===== NOTICES =====
    function NoticesBar() {
      const [index, setIndex] = useState(0);
      const notices = [
        '欢迎来到鹦鹉世界，紫米的温暖小窝 🌿',
        '一只绿鹦鹉的岛屿生活记录，每一天都很平凡又美好。',

      useEffect(() => {
        const t = setInterval(() => setIndex(i => (i + 1) % notices.length), 4000);
        return () => clearInterval(t);
      }, [notices.length]);

      return (
        <div className="notices-bar">
          <span>{notices[index]}</span>
          <span className={`notice-dot ${index === 0 ? 'active' : ''}`} onClick={() => setIndex(0)} />

    // ===== PHOTO WALL =====
    const photos = [

    // ===== BLOG POSTS / MOMENTS =====

    // ===== APP =====
    function App() {
      const [activeTab, setActiveTab] = useState('photos');
      const [isDark, setIsDark] = useState(false);
      const [headerCompact, setHeaderCompact] = useState(false);

      const toggleTheme = () => {
        const next = !isDark;
        setIsDark(next);
        document.documentElement.setAttribute('data-theme', next ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-setting', next ? 'dark' : 'light');
      };

      useEffect(() => {
        const handleScroll = () => {
          setHeaderCompact(window.scrollY > 12);

          const sections = ['photos', 'moments', 'about'];
          for (const id of sections) {
            const el = document.getElementById(id);
            if (el) {
              const rect = el.getBoundingClientRect();
              if (rect.top <= 100 && rect.bottom > 100) {
                setActiveTab(id);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        const el = document.getElementById(tab);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      return (
        <div>
          <Header
            activeTab={activeTab}
            onTabChange={handleTabChange}
            isDark={isDark}
            onThemeToggle={toggleTheme}
            isCompact={headerCompact}
          />
          <NoticesBar />
          <Hero />
          <main className="main-content">
            <div className="content-primary">
              <PhotoWall />
              <MomentsSection />
              <AboutSection />
            </div>
            <Sidebar />
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
